<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행도리의 생일나무</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 5%, rgba(123, 92, 255, 0.45), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(255, 122, 160, 0.25), transparent 30%),
        linear-gradient(to bottom, #05071d, #121846 45%, #271b3d 78%, #0b1020);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ffdca8 1px, transparent 1px),
        radial-gradient(#b9d8ff 1px, transparent 1px);
      background-size: 36px 36px, 68px 68px, 110px 110px;
      opacity: .55;
      animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .35; }
      to { opacity: .75; }
    }

    .shooting-star {
      position: fixed;
      top: 90px;
      left: -120px;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fff);
      transform: rotate(-25deg);
      animation: shoot 5s infinite;
      opacity: .8;
      pointer-events: none;
    }

    @keyframes shoot {
      0% { transform: translateX(0) translateY(0) rotate(-25deg); opacity: 0; }
      15% { opacity: 1; }
      35% { transform: translateX(850px) translateY(250px) rotate(-25deg); opacity: 0; }
      100% { opacity: 0; }
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 18px 44px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .date {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.35);
      color: #ffe8b9;
      font-size: 14px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.15;
      letter-spacing: -1px;
      text-shadow: 0 0 18px rgba(255, 232, 180, .9);
    }

    .sub {
      margin-top: 15px;
      font-size: 15px;
      line-height: 1.8;
      color: #ffe9c8;
    }

    .scene {
      position: relative;
      height: 470px;
      margin-top: 10px;
    }

    .moon {
      position: absolute;
      right: 34px;
      top: 16px;
      font-size: 42px;
      filter: drop-shadow(0 0 12px rgba(255,255,210,.8));
    }

    .tree-wrap {
      position: absolute;
      left: 50%;
      top: 95px;
      width: 320px;
      height: 300px;
      transform: translateX(-50%);
      z-index: 2;
    }

    .tree-top {
      position: absolute;
      left: 50%;
      top: 0;
      width: 260px;
      height: 210px;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 35% 35%, #8fd66b, transparent 28%),
        radial-gradient(circle at 68% 44%, #6dbd50, transparent 34%),
        radial-gradient(circle at 50% 65%, #47963d 0%, #2d6f32 75%);
      border-radius: 48% 52% 45% 55% / 55% 50% 50% 45%;
      box-shadow:
        inset 0 -18px 30px rgba(0,0,0,.18),
        0 0 30px rgba(255, 230, 150, .28);
    }

    .tree-top::before,
    .tree-top::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
      filter: blur(.2px);
    }

    .tree-top::before {
      width: 165px;
      height: 150px;
      left: -18px;
      top: 65px;
    }

    .tree-top::after {
      width: 175px;
      height: 155px;
      right: -22px;
      top: 62px;
    }

    .trunk {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 68px;
      height: 125px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #6b3e24, #a56a3a, #5a321f);
      border-radius: 28px 28px 12px 12px;
      z-index: -1;
      box-shadow: inset -10px 0 14px rgba(0,0,0,.2);
    }

    .tree-light {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff4bd;
      box-shadow: 0 0 12px #ffe48a;
      animation: blink 1.8s infinite alternate;
    }

    @keyframes blink {
      from { opacity: .35; transform: scale(.8); }
      to { opacity: 1; transform: scale(1.2); }
    }

    .character {
      position: absolute;
      z-index: 5;
      font-size: 70px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.35));
    }

    .boy {
      left: 24px;
      bottom: 40px;
    }

    .bear {
      right: 25px;
      bottom: 38px;
    }

    .cake {
      position: absolute;
      right: 92px;
      bottom: 28px;
      font-size: 40px;
      z-index: 5;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.35));
    }

    .count-box {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 230px;
      transform: translateX(-50%);
      padding: 12px;
      border-radius: 22px;
      background: rgba(0,0,0,.48);
      border: 1px solid rgba(255,255,255,.28);
      backdrop-filter: blur(8px);
      z-index: 8;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .count {
      font-size: 31px;
      font-weight: 800;
      color: #ffe7a7;
      margin: 2px 0;
    }

    .fruit {
      position: absolute;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      cursor: pointer;
      z-index: 9;
      animation: fruitPop .35s ease;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
    }

    @keyframes fruitPop {
      from { transform: scale(0) rotate(-20deg); }
      to { transform: scale(1) rotate(0); }
    }

    .form-card {
      margin-top: 22px;
      padding: 24px 18px;
      border-radius: 30px;
      background: rgba(255,255,255,.95);
      color: #4a3328;
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .form-card h2 {
      margin: 0 0 16px;
      font-size: 23px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #e8cbbd;
      border-radius: 17px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 15px;
      font-family: inherit;
      background: #fffaf7;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: none;
      line-height: 1.5;
    }

    .fruit-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 8px 0 14px;
    }

    .fruit-btn {
      border: 1px solid #ead0c0;
      background: #fff7f1;
      border-radius: 16px;
      padding: 11px 4px;
      font-size: 25px;
      cursor: pointer;
    }

    .fruit-btn.active {
      background: #ffe1e7;
      border: 2px solid #ff7896;
      transform: translateY(-2px);
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 15px;
      font-size: 17px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #ff7b98, #ff5278);
      box-shadow: 0 8px 20px rgba(255,82,120,.35);
      cursor: pointer;
    }

    .footer {
      margin-top: 22px;
      color: #ffe8c4;
      font-size: 13px;
      line-height: 1.7;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      padding: 24px;
      background: rgba(0,0,0,.58);
      z-index: 99;
      align-items: center;
      justify-content: center;
    }

    .letter {
      width: 100%;
      max-width: 355px;
      padding: 26px 22px;
      border-radius: 30px;
      background:
        linear-gradient(#fffaf2, #fff1e5);
      color: #4a3328;
      text-align: center;
      line-height: 1.75;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      border: 1px solid #f2d5c3;
    }

    .letter-title {
      font-size: 15px;
      color: #d85d75;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .emoji {
      font-size: 43px;
      margin-bottom: 8px;
    }

    .modal-msg {
      white-space: pre-wrap;
      font-size: 16px;
      color: #4a3328;
    }

    .nickname {
      margin-top: 15px;
      color: #d85d75;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .close, .delete {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .close { background: #d9a15f; }
    .delete { background: #8f8f8f; }

    .admin-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #8b7768;
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="shooting-star"></div>

  <main class="wrap">
    <section class="hero">
      <div class="date">6월 7일</div>
      <h1>행도리의<br>생일나무</h1>
      <div class="sub">
        축하 한마디가 열매가 됩니다.<br>
        따뜻한 말 한마디만 남겨주시면<br>
        소중하게 간직할게요.
      </div>
    </section>

    <section class="scene" id="treeArea">
      <div class="moon">🌙</div>

      <div class="tree-wrap">
        <div class="tree-top"></div>
        <div class="trunk"></div>

        <span class="tree-light" style="left:85px; top:52px;"></span>
        <span class="tree-light" style="left:190px; top:45px;"></span>
        <span class="tree-light" style="left:55px; top:135px;"></span>
        <span class="tree-light" style="left:245px; top:145px;"></span>
        <span class="tree-light" style="left:155px; top:110px;"></span>
      </div>

      <div class="character boy">🎧</div>
      <div class="character bear">🐻</div>
      <div class="cake">🎂</div>

      <div class="count-box">
        <div>현재까지</div>
        <div class="count" id="count">0</div>
        <div>개의 축하가 모였어요!</div>
      </div>
    </section>

    <section class="form-card">
      <h2>💌 축하 한마디 남기기</h2>

      <input id="nameInput" maxlength="12" placeholder="닉네임을 입력해주세요" />
      <textarea id="messageInput" maxlength="120" placeholder="행도리에게 생일 축하 한마디를 남겨주세요"></textarea>

      <div class="fruit-select">
        <button class="fruit-btn active" data-fruit="🍎">🍎</button>
        <button class="fruit-btn" data-fruit="🍑">🍑</button>
        <button class="fruit-btn" data-fruit="🍉">🍉</button>
        <button class="fruit-btn" data-fruit="🍍">🍍</button>
      </div>

      <button class="submit" id="submitBtn">열매 달기</button>
    </section>

    <div class="footer">
      당신의 따뜻한 말이<br>
      행도리의 생일나무를 더 풍성하게 만들어줘요.
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="letter">
      <div class="letter-title">행도리에게 도착한 축하 편지</div>
      <div class="emoji" id="modalFruit">🍎</div>
      <div class="modal-msg" id="modalMessage"></div>
      <div class="nickname" id="modalName"></div>

      <div class="modal-actions">
        <button class="close" onclick="closeModal()">닫기</button>
        <button class="delete" id="deleteBtn">관리자 삭제</button>
      </div>

      <div class="admin-hint">관리자만 삭제할 수 있어요.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Wca2IDavR1TLIpWYMz8TIUzttm9vzfXE",
      authDomain: "hangdori-ab07d.firebaseapp.com",
      projectId: "hangdori-ab07d",
      storageBucket: "hangdori-ab07d.firebasestorage.app",
      messagingSenderId: "797694080049",
      appId: "1:797694080049:web:6fdf62f9cb4ac9d8255110"
    };

    const ADMIN_PASSWORD = "hangdori0607";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const treeArea = document.getElementById("treeArea");
    const countEl = document.getElementById("count");
    const nameInput = document.getElementById("nameInput");
    const messageInput = document.getElementById("messageInput");
    const submitBtn = document.getElementById("submitBtn");
    const modal = document.getElementById("modal");
    const modalFruit = document.getElementById("modalFruit");
    const modalMessage = document.getElementById("modalMessage");
    const modalName = document.getElementById("modalName");
    const deleteBtn = document.getElementById("deleteBtn");

    let selectedFruit = "🍎";
    let selectedDocId = null;

    const positions = [
      [183, 112], [124, 132], [234, 140],
      [86, 182], [165, 178], [270, 190],
      [112, 234], [220, 238], [286, 256],
      [150, 282], [250, 298], [74, 268],
      [190, 322], [118, 330], [285, 330],
      [155, 70], [220, 82], [95, 105]
    ];

    document.querySelectorAll(".fruit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fruit-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFruit = btn.dataset.fruit;
      });
    });

    submitBtn.addEventListener("click", async () => {
      const nickname = nameInput.value.trim() || "익명의 친구";
      const message = messageInput.value.trim();

      if (!message) {
        alert("축하 멘트를 적어주세요!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "열매 다는 중...";

      try {
        await addDoc(collection(db, "birthdayMessages"), {
          nickname,
          message,
          fruit: selectedFruit,
          createdAt: serverTimestamp()
        });

        nameInput.value = "";
        messageInput.value = "";
        alert("행도리의 생일나무에 열매가 열렸어요!");
      } catch (error) {
        alert("저장 중 문제가 생겼어요.");
        console.error(error);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "열매 달기";
    });

    const q = query(collection(db, "birthdayMessages"), orderBy("createdAt", "asc"));

    onSnapshot(q, (snapshot) => {
      document.querySelectorAll(".fruit").forEach(el => el.remove());
      countEl.innerText = snapshot.size;

      snapshot.docs.forEach((docSnap, index) => {
        const data = docSnap.data();
        const fruit = document.createElement("div");
        fruit.className = "fruit";
        fruit.innerText = data.fruit || "🍎";

        const pos = positions[index % positions.length];
        fruit.style.left = pos[0] + "px";
        fruit.style.top = pos[1] + "px";

        fruit.addEventListener("click", () => {
          selectedDocId = docSnap.id;
          modalFruit.innerText = data.fruit || "🍎";
          modalMessage.innerText = data.message || "";
          modalName.innerText = "- " + (data.nickname || "익명의 친구") + " -";
          modal.style.display = "flex";
        });

        treeArea.appendChild(fruit);
      });
    });

    deleteBtn.addEventListener("click", async () => {
      if (!selectedDocId) return;

      const password = prompt("관리자 비밀번호를 입력해주세요.");

      if (password !== ADMIN_PASSWORD) {
        alert("비밀번호가 맞지 않아요.");
        return;
      }

      const ok = confirm("이 축하글을 삭제할까요?");
      if (!ok) return;

      try {
        await deleteDoc(doc(db, "birthdayMessages", selectedDocId));
        alert("삭제됐어요.");
        closeModal();
      } catch (error) {
        alert("삭제 중 문제가 생겼어요.");
        console.error(error);
      }
    });

    window.closeModal = function () {
      modal.style.display = "none";
      selectedDocId = null;
    };

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
