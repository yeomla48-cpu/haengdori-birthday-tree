<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행도리의 생일나무</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 190, 110, .14), transparent 28%),
        linear-gradient(to bottom, #050817 0%, #080a18 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.18));
    }

    .page {
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 1180px;
      padding: 0 18px 38px;
      text-align: center;
    }

    .visual {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      border-radius: 0 0 30px 30px;
      overflow: hidden;
      background: url("background.jpg") center center / contain no-repeat;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.04) 65%, rgba(0,0,0,.28) 100%);
    }

    .date-badge {
      display: inline-block;
      padding: 8px 26px;
      border-radius: 999px;
      background: rgba(49, 31, 20, .72);
      border: 1px solid rgba(255, 221, 145, .88);
      color: #ffe8b8;
      box-shadow: 0 0 22px rgba(255, 198, 90, .38);
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .title {
      margin: 18px 0 8px;
      font-size: clamp(38px, 8vw, 56px);
      line-height: 1.08;
      letter-spacing: -2px;
      color: #fff7dd;
      text-shadow:
        0 0 10px #fff4c8,
        0 0 22px rgba(255, 213, 124, .9),
        0 0 42px rgba(255, 183, 70, .72);
    }

    .ribbon {
      display: inline-block;
      margin: 12px auto 10px;
      padding: 10px 24px;
      border-radius: 999px;
      background: linear-gradient(#fff4d8, #ffdcae);
      color: #5c351d;
      font-weight: 900;
      border: 1px solid rgba(123, 74, 29, .25);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }

    .sub {
      margin-top: 10px;
      color: #fff0c8;
      font-size: 14px;
      line-height: 1.75;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      font-weight: 700;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      overflow: visible;
      z-index: 2;
    }

    #treeArea {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .count-box {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 252px;
      margin: 0;
      padding: 13px 14px;
      background:
        linear-gradient(135deg, rgba(83, 52, 28, .93), rgba(31, 22, 18, .93));
      border: 1px solid rgba(255, 223, 143, .85);
      border-radius: 18px;
      box-shadow:
        0 12px 32px rgba(0,0,0,.42),
        0 0 22px rgba(255, 197, 88, .2);
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .count-label {
      color: #ffe7b0;
      font-size: 13px;
      font-weight: 800;
    }

    .count {
      font-size: 35px;
      font-weight: 900;
      color: #ffe39a;
      margin: 1px 0;
      text-shadow: 0 0 14px rgba(255, 218, 120, .45);
    }

    .count-small {
      font-size: 13px;
      color: #fff6dd;
      font-weight: 700;
    }

    .fruit {
      position: absolute;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      cursor: pointer;
      z-index: 8;
      filter: drop-shadow(0 7px 9px rgba(0,0,0,.5));
      animation: fruitPop .35s ease;
    }

    @keyframes fruitPop {
      from { transform: scale(0) rotate(-25deg); }
      to { transform: scale(1) rotate(0); }
    }

    .form-card {
      max-width: 680px;
      margin: 26px auto 0;
      padding: 25px 18px 20px;
      background: rgba(255, 253, 248, .94);
      color: #4d3425;
      border: 2px solid #f2cab9;
      border-radius: 30px;
      box-shadow:
        0 16px 42px rgba(0,0,0,.34),
        inset 0 0 0 1px rgba(255,255,255,.8);
      backdrop-filter: blur(8px);
    }

    .form-card h2 {
      margin: 0 0 18px;
      font-size: 25px;
      letter-spacing: -1px;
      color: #4e3324;
    }

    .label-row {
      text-align: left;
      font-size: 13px;
      font-weight: 900;
      color: #c35d76;
      margin: 5px 0 7px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #e8bdae;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-family: inherit;
      background: #fffaf6;
      outline: none;
      margin-bottom: 13px;
    }

    textarea {
      min-height: 110px;
      resize: none;
      line-height: 1.5;
    }

    .fruit-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 4px 0 15px;
    }

    .fruit-btn {
      height: 58px;
      border-radius: 16px;
      border: 1px solid #efcaba;
      background: #fff8f1;
      font-size: 27px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,.06);
    }

    .fruit-btn.active {
      border: 2px solid #ff6f93;
      background: #ffe7ee;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(255, 111, 147, .22);
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #ff8fa8, #ff5278);
      box-shadow: 0 10px 22px rgba(255, 82, 120, .36);
      cursor: pointer;
    }

    .footer {
      margin-top: 18px;
      color: #ffe6b2;
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 6px rgba(0,0,0,.55);
      font-weight: 700;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      z-index: 99;
      padding: 24px;
      align-items: center;
      justify-content: center;
    }

    .letter {
      width: 100%;
      max-width: 350px;
      background: linear-gradient(#fffaf2, #fff0e5);
      color: #4d3425;
      border: 1px solid #f0c9b8;
      border-radius: 30px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      line-height: 1.75;
    }

    .letter-title {
      color: #c25c70;
      font-weight: 900;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .emoji {
      font-size: 44px;
      margin-bottom: 8px;
    }

    .modal-msg {
      white-space: pre-wrap;
      font-size: 16px;
    }

    .nickname {
      margin-top: 14px;
      color: #d85d75;
      font-weight: 900;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .close, .delete {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .close { background: #d9a05b; }
    .delete { background: #777; }

    .admin-hint {
      margin-top: 9px;
      color: #8b7568;
      font-size: 12px;
    }

    @media (min-width: 900px) {
      .wrap {
        max-width: 1180px;
      }

      .visual {
        max-width: 1180px;
      }

      .form-card {
        max-width: 680px;
        padding: 30px 34px 24px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1.35fr;
        gap: 14px;
        align-items: start;
      }

      textarea {
        min-height: 100px;
      }
    }

    @media (max-width: 480px) {
      body {
        background-color: #080a18;
      }

      body::before {
        background: linear-gradient(to bottom, rgba(0,0,0,.04), rgba(0,0,0,.16));
      }

      .page {
        display: block;
        min-height: 100vh;
      }

      .wrap {
        max-width: 100%;
        padding: 0 12px 34px;
      }

      .visual {
        width: calc(100% + 24px);
        margin-left: -12px;
        margin-right: -12px;
        border-radius: 0 0 22px 22px;
      }

      .count-box {
        top: 60%;
        width: 188px;
        padding: 9px 10px;
        border-radius: 14px;
      }

      .count-label {
        font-size: 11px;
      }

      .count {
        font-size: 25px;
      }

      .count-small {
        font-size: 11px;
      }

      .fruit {
        width: 28px;
        height: 28px;
        font-size: 21px;
      }

      .form-card {
        margin-top: 28px;
        border-radius: 26px;
        padding: 22px 16px 18px;
        background: rgba(255, 253, 248, .96);
      }

      .form-card h2 {
        font-size: 25px;
        margin-bottom: 18px;
      }

      input, textarea {
        font-size: 16px;
        padding: 14px 15px;
      }

      textarea {
        min-height: 120px;
      }

      .fruit-select {
        gap: 10px;
      }

      .fruit-btn {
        height: 62px;
        font-size: 28px;
      }

      .submit {
        padding: 17px;
        font-size: 19px;
      }

      .footer {
        margin-top: 20px;
        padding-bottom: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="wrap">
      <section class="visual">
        <div class="hero-overlay" id="treeArea">
          <div class="count-box">
            <div class="count-label">✦ 현재까지 ✦</div>
            <div class="count" id="count">0</div>
            <div class="count-small">개의 축하가 모였어요!</div>
          </div>
        </div>
      </section>

      <section class="form-card">
        <h2>🌷 축하 한마디 남기기 🌷</h2>

        <div class="form-grid">
          <div>
            <div class="label-row">🌸 닉네임</div>
            <input id="nameInput" maxlength="12" placeholder="닉네임을 입력해주세요" />
          </div>

          <div>
            <div class="label-row">🌸 축하 멘트</div>
            <textarea id="messageInput" maxlength="120" placeholder="행도리에게 축하 한마디를 남겨주세요!"></textarea>
          </div>
        </div>

        <div class="fruit-select">
          <button class="fruit-btn active" data-fruit="🍎">🍎</button>
          <button class="fruit-btn" data-fruit="🍑">🍑</button>
          <button class="fruit-btn" data-fruit="🍉">🍉</button>
          <button class="fruit-btn" data-fruit="🍍">🍍</button>
        </div>

        <button class="submit" id="submitBtn">🍎 열매 달기</button>
      </section>

      <div class="footer">
        ♡ 당신의 따뜻한 말이 행도리의 생일나무를 더 풍성하게 만들어요.
      </div>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="letter">
      <div class="letter-title">행도리에게 도착한 축하 편지</div>
      <div class="emoji" id="modalFruit">🍎</div>
      <div class="modal-msg" id="modalMessage"></div>
      <div class="nickname" id="modalName"></div>

      <div class="modal-actions">
        <button class="close" onclick="closeModal()">닫기</button>
        <button class="delete" id="deleteBtn">관리자 삭제</button>
      </div>

      <div class="admin-hint">관리자만 삭제할 수 있어요.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Wca2IDavR1TLIpWYMz8TIUzttm9vzfXE",
      authDomain: "hangdori-ab07d.firebaseapp.com",
      projectId: "hangdori-ab07d",
      storageBucket: "hangdori-ab07d.firebasestorage.app",
      messagingSenderId: "797694080049",
      appId: "1:797694080049:web:6fdf62f9cb4ac9d8255110"
    };

    const ADMIN_PASSWORD = "hangdori0607";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const treeArea = document.getElementById("treeArea");
    const countEl = document.getElementById("count");
    const nameInput = document.getElementById("nameInput");
    const messageInput = document.getElementById("messageInput");
    const submitBtn = document.getElementById("submitBtn");
    const modal = document.getElementById("modal");
    const modalFruit = document.getElementById("modalFruit");
    const modalMessage = document.getElementById("modalMessage");
    const modalName = document.getElementById("modalName");
    const deleteBtn = document.getElementById("deleteBtn");

    let selectedFruit = "🍎";
    let selectedDocId = null;

    const positions = [
      [45, 18], [52, 18], [39, 23], [58, 24],
      [34, 31], [64, 31], [43, 33], [55, 34],
      [37, 40], [61, 40], [48, 42], [52, 47],
      [41, 48], [58, 49], [46, 27], [54, 28],
      [50, 36], [44, 44], [56, 44], [50, 23]
    ];

    document.querySelectorAll(".fruit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fruit-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFruit = btn.dataset.fruit;
      });
    });

    submitBtn.addEventListener("click", async () => {
      const nickname = nameInput.value.trim() || "익명의 친구";
      const message = messageInput.value.trim();

      if (!message) {
        alert("축하 멘트를 적어주세요!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "열매 다는 중...";

      try {
        await addDoc(collection(db, "birthdayMessages"), {
          nickname,
          message,
          fruit: selectedFruit,
          createdAt: serverTimestamp()
        });

        nameInput.value = "";
        messageInput.value = "";
        alert("행도리의 생일나무에 열매가 열렸어요!");
      } catch (error) {
        alert("저장 중 문제가 생겼어요.");
        console.error(error);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "🍎 열매 달기";
    });

    const q = query(collection(db, "birthdayMessages"), orderBy("createdAt", "asc"));

    onSnapshot(q, (snapshot) => {
      document.querySelectorAll(".fruit").forEach(el => el.remove());
      countEl.innerText = snapshot.size;

      snapshot.docs.forEach((docSnap, index) => {
        const data = docSnap.data();
        const fruit = document.createElement("div");
        fruit.className = "fruit";
        fruit.innerText = data.fruit || "🍎";

        const pos = positions[index % positions.length];
        fruit.style.left = pos[0] + "%";
        fruit.style.top = pos[1] + "%";
        fruit.style.transform = "translate(-50%, -50%)";

        fruit.addEventListener("click", () => {
          selectedDocId = docSnap.id;
          modalFruit.innerText = data.fruit || "🍎";
          modalMessage.innerText = data.message || "";
          modalName.innerText = "- " + (data.nickname || "익명의 친구") + " -";
          modal.style.display = "flex";
        });

        treeArea.appendChild(fruit);
      });
    });

    deleteBtn.addEventListener("click", async () => {
      if (!selectedDocId) return;

      const password = prompt("관리자 비밀번호를 입력해주세요.");

      if (password !== ADMIN_PASSWORD) {
        alert("비밀번호가 맞지 않아요.");
        return;
      }

      const ok = confirm("이 축하글을 삭제할까요?");
      if (!ok) return;

      try {
        await deleteDoc(doc(db, "birthdayMessages", selectedDocId));
        alert("삭제됐어요.");
        closeModal();
      } catch (error) {
        alert("삭제 중 문제가 생겼어요.");
        console.error(error);
      }
    });

    window.closeModal = function () {
      modal.style.display = "none";
      selectedDocId = null;
    };

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
