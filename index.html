<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행도리의 생일나무</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 198, 116, .22), transparent 22%),
        radial-gradient(circle at 18% 75%, rgba(255, 110, 160, .22), transparent 25%),
        linear-gradient(to bottom, #050819 0%, #09133a 38%, #2d2453 72%, #0b101f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ffd27a 1px, transparent 1px),
        radial-gradient(#9bc7ff 1px, transparent 1px);
      background-size: 38px 38px, 75px 75px, 120px 120px;
      opacity: .65;
      pointer-events: none;
      animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .42; }
      to { opacity: .8; }
    }

    .shooting {
      position: fixed;
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fff);
      top: 120px;
      left: -180px;
      transform: rotate(-25deg);
      animation: shoot 6s infinite;
      pointer-events: none;
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translate(0,0) rotate(-25deg); }
      10% { opacity: 1; }
      32% { opacity: 0; transform: translate(900px, 280px) rotate(-25deg); }
      100% { opacity: 0; }
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 24px 16px 38px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .date-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 8px 24px;
      border-radius: 999px;
      background: rgba(57, 35, 20, .55);
      border: 1px solid rgba(255, 218, 148, .75);
      color: #ffe6b1;
      box-shadow: 0 0 18px rgba(255, 201, 112, .28);
      font-weight: bold;
    }

    .title {
      margin: 18px 0 8px;
      font-size: 46px;
      line-height: 1.12;
      letter-spacing: -2px;
      color: #fff6dd;
      text-shadow:
        0 0 10px #fff1c2,
        0 0 24px rgba(255, 215, 128, .85),
        0 0 42px rgba(255, 191, 86, .55);
    }

    .title .heart {
      font-size: 34px;
      vertical-align: middle;
    }

    .ribbon {
      display: inline-block;
      margin: 12px auto 6px;
      padding: 10px 22px;
      background: linear-gradient(#fff0d3, #ffd9a7);
      color: #5c351d;
      border-radius: 999px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0,0,0,.25);
      border: 1px solid rgba(123, 74, 29, .25);
    }

    .sub {
      margin-top: 12px;
      color: #ffe8bd;
      font-size: 14px;
      line-height: 1.7;
    }

    .scene {
      height: 540px;
      position: relative;
      margin-top: 8px;
      overflow: visible;
    }

    .moon {
      position: absolute;
      top: 24px;
      right: 32px;
      font-size: 42px;
      filter: drop-shadow(0 0 18px rgba(255, 223, 140, .9));
      z-index: 2;
    }

    .tree {
      position: absolute;
      left: 50%;
      top: 92px;
      width: 360px;
      height: 360px;
      transform: translateX(-50%);
      z-index: 3;
    }

    .crown {
      position: absolute;
      left: 50%;
      top: 0;
      width: 315px;
      height: 270px;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 32% 36%, #486a35 0 22%, transparent 23%),
        radial-gradient(circle at 65% 34%, #315628 0 26%, transparent 27%),
        radial-gradient(circle at 48% 58%, #1f4625 0 42%, transparent 43%),
        radial-gradient(circle at 50% 50%, #15391f 0 70%, transparent 71%);
      border-radius: 48%;
      box-shadow:
        0 0 35px rgba(255, 216, 120, .22),
        inset 0 -30px 40px rgba(0,0,0,.35);
    }

    .trunk {
      position: absolute;
      left: 50%;
      top: 170px;
      width: 86px;
      height: 190px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #5b331e, #a06535, #4b2719);
      border-radius: 40px 40px 16px 16px;
      box-shadow: inset -12px 0 18px rgba(0,0,0,.28);
      z-index: -1;
    }

    .branch {
      position: absolute;
      width: 140px;
      height: 16px;
      background: #6d3d23;
      border-radius: 999px;
      top: 195px;
      left: 115px;
      transform: rotate(-24deg);
      z-index: -1;
      opacity: .8;
    }

    .branch.b2 {
      left: 110px;
      top: 215px;
      transform: rotate(24deg);
      width: 150px;
    }

    .lantern {
      position: absolute;
      width: 18px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(#fff2a8, #f0a644);
      box-shadow: 0 0 16px #ffd476;
      animation: glow 1.6s infinite alternate;
    }

    @keyframes glow {
      from { opacity: .55; transform: scale(.95); }
      to { opacity: 1; transform: scale(1.08); }
    }

    .l1 { left: 82px; top: 145px; }
    .l2 { left: 260px; top: 132px; }
    .l3 { left: 175px; top: 92px; }
    .l4 { left: 230px; top: 210px; }
    .l5 { left: 115px; top: 225px; }

    .character-boy {
      position: absolute;
      left: 5px;
      bottom: 48px;
      font-size: 86px;
      z-index: 6;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.55));
    }

    .character-bear {
      position: absolute;
      right: 6px;
      bottom: 42px;
      font-size: 88px;
      z-index: 6;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.55));
    }

    .cake {
      position: absolute;
      right: 80px;
      bottom: 38px;
      font-size: 38px;
      z-index: 7;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,.5));
    }

    .count-box {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 245px;
      transform: translateX(-50%);
      padding: 13px 14px;
      background: linear-gradient(135deg, rgba(63,42,22,.88), rgba(30,22,18,.88));
      border: 1px solid rgba(255, 223, 143, .8);
      border-radius: 18px;
      box-shadow:
        0 10px 30px rgba(0,0,0,.38),
        0 0 20px rgba(255, 197, 88, .18);
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .count-label {
      color: #ffe7b0;
      font-size: 13px;
    }

    .count {
      font-size: 34px;
      font-weight: 900;
      color: #ffe39a;
      margin: 0;
    }

    .count-small {
      font-size: 13px;
      color: #fff6dd;
    }

    .fruit {
      position: absolute;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      cursor: pointer;
      z-index: 12;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
      animation: fruitPop .35s ease;
    }

    @keyframes fruitPop {
      from { transform: scale(0) rotate(-25deg); }
      to { transform: scale(1) rotate(0); }
    }

    .form-card {
      margin-top: 12px;
      padding: 24px 18px 20px;
      background: linear-gradient(#fffdf7, #fff0e5);
      color: #4d3425;
      border: 2px solid #f1cdbd;
      border-radius: 28px;
      box-shadow:
        0 14px 35px rgba(0,0,0,.34),
        inset 0 0 0 1px rgba(255,255,255,.8);
    }

    .form-card h2 {
      margin: 0 0 18px;
      font-size: 25px;
      letter-spacing: -1px;
    }

    .label-row {
      text-align: left;
      font-size: 13px;
      font-weight: 800;
      color: #b75e72;
      margin: 5px 0 7px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #e6bcae;
      border-radius: 15px;
      padding: 14px;
      font-size: 15px;
      font-family: inherit;
      background: #fffaf6;
      outline: none;
      margin-bottom: 13px;
    }

    textarea {
      min-height: 108px;
      resize: none;
      line-height: 1.5;
    }

    .fruit-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 4px 0 15px;
    }

    .fruit-btn {
      height: 58px;
      border-radius: 16px;
      border: 1px solid #efcaba;
      background: #fff8f1;
      font-size: 27px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,.05);
    }

    .fruit-btn.active {
      border: 2px solid #ff6f93;
      background: #ffe7ee;
      transform: translateY(-2px);
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #ff8fa8, #ff5479);
      box-shadow: 0 9px 20px rgba(255, 82, 120, .34);
      cursor: pointer;
    }

    .footer {
      margin-top: 20px;
      color: #ffe6b2;
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 6px rgba(0,0,0,.55);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      z-index: 99;
      padding: 24px;
      align-items: center;
      justify-content: center;
    }

    .letter {
      width: 100%;
      max-width: 350px;
      background: linear-gradient(#fffaf2, #fff0e5);
      color: #4d3425;
      border: 1px solid #f0c9b8;
      border-radius: 30px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      line-height: 1.75;
    }

    .letter-title {
      color: #c25c70;
      font-weight: 900;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .emoji {
      font-size: 44px;
      margin-bottom: 8px;
    }

    .modal-msg {
      white-space: pre-wrap;
      font-size: 16px;
    }

    .nickname {
      margin-top: 14px;
      color: #d85d75;
      font-weight: 900;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .close, .delete {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .close { background: #d9a05b; }
    .delete { background: #777; }

    .admin-hint {
      margin-top: 9px;
      color: #8b7568;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .title { font-size: 40px; }
      .tree { transform: translateX(-50%) scale(.92); }
      .scene { height: 500px; }
    }
  </style>
</head>

<body>
  <div class="shooting"></div>

  <main class="wrap">
    <div class="date-badge">✦ 6월 7일 ✦</div>

    <h1 class="title">
      행도리의<br>
      생일나무 <span class="heart">♡</span>
    </h1>

    <div class="ribbon">축하 한마디가 열매가 됩니다.</div>

    <div class="sub">
      여러분의 따뜻한 말 한마디가<br>
      행도리의 생일나무를 반짝이게 해요.
    </div>

    <section class="scene" id="treeArea">
      <div class="moon">🌙</div>

      <div class="tree">
        <div class="crown"></div>
        <div class="branch"></div>
        <div class="branch b2"></div>
        <div class="trunk"></div>
        <div class="lantern l1"></div>
        <div class="lantern l2"></div>
        <div class="lantern l3"></div>
        <div class="lantern l4"></div>
        <div class="lantern l5"></div>
      </div>

      <div class="character-boy">🎧</div>
      <div class="character-bear">🐻</div>
      <div class="cake">🎂</div>

      <div class="count-box">
        <div class="count-label">✦ 현재까지 ✦</div>
        <div class="count" id="count">0</div>
        <div class="count-small">개의 축하가 모였어요!</div>
      </div>
    </section>

    <section class="form-card">
      <h2>🌷 축하 한마디 남기기 🌷</h2>

      <div class="label-row">🌸 닉네임</div>
      <input id="nameInput" maxlength="12" placeholder="닉네임을 입력해주세요" />

      <div class="label-row">🌸 축하 멘트</div>
      <textarea id="messageInput" maxlength="120" placeholder="행도리에게 축하 한마디를 남겨주세요!"></textarea>

      <div class="fruit-select">
        <button class="fruit-btn active" data-fruit="🍎">🍎</button>
        <button class="fruit-btn" data-fruit="🍑">🍑</button>
        <button class="fruit-btn" data-fruit="🍉">🍉</button>
        <button class="fruit-btn" data-fruit="🍍">🍍</button>
      </div>

      <button class="submit" id="submitBtn">🍎 열매 달기</button>
    </section>

    <div class="footer">
      ♡ 당신의 따뜻한 말이 행도리의 생일나무를 더 풍성하게 만들어요.
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="letter">
      <div class="letter-title">행도리에게 도착한 축하 편지</div>
      <div class="emoji" id="modalFruit">🍎</div>
      <div class="modal-msg" id="modalMessage"></div>
      <div class="nickname" id="modalName"></div>

      <div class="modal-actions">
        <button class="close" onclick="closeModal()">닫기</button>
        <button class="delete" id="deleteBtn">관리자 삭제</button>
      </div>

      <div class="admin-hint">관리자만 삭제할 수 있어요.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Wca2IDavR1TLIpWYMz8TIUzttm9vzfXE",
      authDomain: "hangdori-ab07d.firebaseapp.com",
      projectId: "hangdori-ab07d",
      storageBucket: "hangdori-ab07d.firebasestorage.app",
      messagingSenderId: "797694080049",
      appId: "1:797694080049:web:6fdf62f9cb4ac9d8255110"
    };

    const ADMIN_PASSWORD = "hangdori0607";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const treeArea = document.getElementById("treeArea");
    const countEl = document.getElementById("count");
    const nameInput = document.getElementById("nameInput");
    const messageInput = document.getElementById("messageInput");
    const submitBtn = document.getElementById("submitBtn");
    const modal = document.getElementById("modal");
    const modalFruit = document.getElementById("modalFruit");
    const modalMessage = document.getElementById("modalMessage");
    const modalName = document.getElementById("modalName");
    const deleteBtn = document.getElementById("deleteBtn");

    let selectedFruit = "🍎";
    let selectedDocId = null;

    const positions = [
      [165, 132], [110, 165], [220, 166], [78, 215],
      [250, 220], [145, 230], [190, 265], [105, 285],
      [235, 295], [160, 85], [212, 104], [100, 112],
      [265, 135], [65, 150], [285, 180], [188, 204],
      [130, 250], [230, 250], [155, 310], [255, 330]
    ];

    document.querySelectorAll(".fruit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fruit-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFruit = btn.dataset.fruit;
      });
    });

    submitBtn.addEventListener("click", async () => {
      const nickname = nameInput.value.trim() || "익명의 친구";
      const message = messageInput.value.trim();

      if (!message) {
        alert("축하 멘트를 적어주세요!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "열매 다는 중...";

      try {
        await addDoc(collection(db, "birthdayMessages"), {
          nickname,
          message,
          fruit: selectedFruit,
          createdAt: serverTimestamp()
        });

        nameInput.value = "";
        messageInput.value = "";
        alert("행도리의 생일나무에 열매가 열렸어요!");
      } catch (error) {
        alert("저장 중 문제가 생겼어요.");
        console.error(error);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "🍎 열매 달기";
    });

    const q = query(collection(db, "birthdayMessages"), orderBy("createdAt", "asc"));

    onSnapshot(q, (snapshot) => {
      document.querySelectorAll(".fruit").forEach(el => el.remove());
      countEl.innerText = snapshot.size;

      snapshot.docs.forEach((docSnap, index) => {
        const data = docSnap.data();
        const fruit = document.createElement("div");
        fruit.className = "fruit";
        fruit.innerText = data.fruit || "🍎";

        const pos = positions[index % positions.length];
        fruit.style.left = pos[0] + "px";
        fruit.style.top = pos[1] + "px";

        fruit.addEventListener("click", () => {
          selectedDocId = docSnap.id;
          modalFruit.innerText = data.fruit || "🍎";
          modalMessage.innerText = data.message || "";
          modalName.innerText = "- " + (data.nickname || "익명의 친구") + " -";
          modal.style.display = "flex";
        });

        treeArea.appendChild(fruit);
      });
    });

    deleteBtn.addEventListener("click", async () => {
      if (!selectedDocId) return;

      const password = prompt("관리자 비밀번호를 입력해주세요.");

      if (password !== ADMIN_PASSWORD) {
        alert("비밀번호가 맞지 않아요.");
        return;
      }

      const ok = confirm("이 축하글을 삭제할까요?");
      if (!ok) return;

      try {
        await deleteDoc(doc(db, "birthdayMessages", selectedDocId));
        alert("삭제됐어요.");
        closeModal();
      } catch (error) {
        alert("삭제 중 문제가 생겼어요.");
        console.error(error);
      }
    });

    window.closeModal = function () {
      modal.style.display = "none";
      selectedDocId = null;
    };

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
