<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행도리의 생일나무</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 207, 112, .28), transparent 24%),
        radial-gradient(circle at 18% 75%, rgba(255, 118, 170, .22), transparent 28%),
        linear-gradient(to bottom, #030718 0%, #07133a 36%, #33265c 70%, #08101f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ffd27a 1px, transparent 1px),
        radial-gradient(#9cc7ff 1px, transparent 1px);
      background-size: 34px 34px, 72px 72px, 118px 118px;
      opacity: .68;
      animation: twinkle 4s infinite alternate;
      z-index: 0;
    }

    @keyframes twinkle {
      from { opacity: .42; }
      to { opacity: .82; }
    }

    .shooting {
      position: fixed;
      top: 95px;
      left: -180px;
      width: 160px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fff, #8dc8ff);
      transform: rotate(-25deg);
      animation: shoot 6s infinite;
      pointer-events: none;
      z-index: 1;
    }

    .shooting.two {
      top: 190px;
      animation-delay: 2.7s;
      width: 120px;
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translate(0,0) rotate(-25deg); }
      12% { opacity: 1; }
      34% { opacity: 0; transform: translate(850px, 270px) rotate(-25deg); }
      100% { opacity: 0; }
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 24px 16px 38px;
      position: relative;
      z-index: 5;
      text-align: center;
    }

    .date-badge {
      display: inline-block;
      padding: 8px 26px;
      border-radius: 999px;
      background: rgba(49, 31, 20, .72);
      border: 1px solid rgba(255, 221, 145, .88);
      color: #ffe8b8;
      box-shadow: 0 0 22px rgba(255, 198, 90, .38);
      font-weight: 900;
    }

    .title {
      margin: 18px 0 8px;
      font-size: 46px;
      line-height: 1.08;
      letter-spacing: -2px;
      color: #fff7dd;
      text-shadow:
        0 0 10px #fff4c8,
        0 0 22px rgba(255, 213, 124, .9),
        0 0 42px rgba(255, 183, 70, .72);
    }

    .heart { font-size: 32px; }

    .ribbon {
      display: inline-block;
      margin: 12px auto 8px;
      padding: 10px 24px;
      border-radius: 999px;
      background: linear-gradient(#fff4d8, #ffdcae);
      color: #5c351d;
      font-weight: 900;
      border: 1px solid rgba(123, 74, 29, .25);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }

    .sub {
      margin-top: 12px;
      color: #ffe8bd;
      font-size: 14px;
      line-height: 1.75;
      text-shadow: 0 2px 8px rgba(0,0,0,.45);
    }

    .scene {
      height: 560px;
      position: relative;
      margin-top: 6px;
      overflow: visible;
    }

    .scene::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 430px;
      height: 150px;
      transform: translateX(-50%);
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 80%, rgba(255, 158, 201, .42) 0 4px, transparent 5px),
        radial-gradient(circle at 28% 72%, rgba(255, 217, 122, .38) 0 3px, transparent 4px),
        radial-gradient(circle at 63% 78%, rgba(255, 158, 201, .42) 0 4px, transparent 5px),
        radial-gradient(circle at 83% 70%, rgba(255, 217, 122, .38) 0 3px, transparent 4px),
        linear-gradient(to top, rgba(21, 42, 27, .62), transparent 78%);
      border-radius: 50% 50% 0 0;
      opacity: .9;
    }

    .moon {
      position: absolute;
      top: 28px;
      right: 30px;
      font-size: 48px;
      filter:
        drop-shadow(0 0 14px rgba(255, 225, 145, .9))
        drop-shadow(0 0 28px rgba(255, 198, 90, .5));
      z-index: 2;
    }

    .tree {
      position: absolute;
      left: 50%;
      top: 70px;
      width: 390px;
      height: 390px;
      transform: translateX(-50%);
      z-index: 6;
    }

    .crown {
      position: absolute;
      left: 50%;
      top: 0;
      width: 345px;
      height: 275px;
      transform: translateX(-50%);
      border-radius: 48%;
      background:
        radial-gradient(circle at 30% 38%, #4f793a 0 23%, transparent 24%),
        radial-gradient(circle at 68% 35%, #376a31 0 28%, transparent 29%),
        radial-gradient(circle at 49% 57%, #25542a 0 46%, transparent 47%),
        radial-gradient(circle at 50% 50%, #142f1b 0 74%, transparent 75%);
      box-shadow:
        0 0 40px rgba(255, 216, 120, .26),
        inset 0 -32px 42px rgba(0,0,0,.36);
    }

    .trunk {
      position: absolute;
      left: 50%;
      top: 172px;
      width: 92px;
      height: 210px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #4b291a, #a86634, #3a2017);
      border-radius: 42px 42px 18px 18px;
      box-shadow: inset -14px 0 18px rgba(0,0,0,.3);
      z-index: -1;
    }

    .branch {
      position: absolute;
      width: 160px;
      height: 17px;
      top: 200px;
      left: 112px;
      transform: rotate(-24deg);
      border-radius: 999px;
      background: #5f351f;
      opacity: .85;
      z-index: -1;
    }

    .branch.b2 {
      top: 222px;
      left: 110px;
      transform: rotate(24deg);
      width: 165px;
    }

    .lantern {
      position: absolute;
      width: 20px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(#fff7bd, #f1a33f);
      box-shadow:
        0 0 10px #ffd97b,
        0 0 22px #ffd97b,
        0 0 36px rgba(255, 196, 80, .5);
      animation: glow 1.7s infinite alternate;
      z-index: 4;
    }

    @keyframes glow {
      from { opacity: .55; transform: scale(.94); }
      to { opacity: 1; transform: scale(1.08); }
    }

    .l1 { left: 82px; top: 145px; }
    .l2 { left: 275px; top: 132px; }
    .l3 { left: 180px; top: 88px; }
    .l4 { left: 238px; top: 220px; }
    .l5 { left: 112px; top: 230px; }
    .l6 { left: 55px; top: 205px; }
    .l7 { left: 305px; top: 205px; }


    .side-character {
      position: fixed;
      bottom: 0;
      z-index: 1;
      pointer-events: none;
      object-fit: cover;
      opacity: .92;
      filter:
        saturate(1.08)
        contrast(1.04)
        drop-shadow(0 24px 44px rgba(0,0,0,.55));
      -webkit-mask-image:
        radial-gradient(ellipse at center, #000 48%, rgba(0,0,0,.78) 67%, transparent 100%);
      mask-image:
        radial-gradient(ellipse at center, #000 48%, rgba(0,0,0,.78) 67%, transparent 100%);
    }

    .side-boy {
      left: 2vw;
      width: min(34vw, 560px);
      height: min(82vh, 760px);
      object-position: center;
    }

    .side-bear {
      right: 2vw;
      width: min(31vw, 510px);
      height: min(78vh, 720px);
      object-position: center;
    }

    .wrap::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 70%, rgba(255, 208, 150, .16), transparent 24%),
        radial-gradient(circle at 85% 70%, rgba(255, 180, 190, .16), transparent 24%);
    }

    .cake {
      position: absolute;
      right: 82px;
      bottom: 42px;
      font-size: 40px;
      z-index: 8;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.5));
    }

    .count-box {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 252px;
      transform: translateX(-50%);
      padding: 13px 14px;
      background:
        linear-gradient(135deg, rgba(83, 52, 28, .93), rgba(31, 22, 18, .93));
      border: 1px solid rgba(255, 223, 143, .85);
      border-radius: 18px;
      box-shadow:
        0 12px 32px rgba(0,0,0,.42),
        0 0 22px rgba(255, 197, 88, .2);
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .count-label {
      color: #ffe7b0;
      font-size: 13px;
      font-weight: 800;
    }

    .count {
      font-size: 35px;
      font-weight: 900;
      color: #ffe39a;
      margin: 1px 0;
      text-shadow: 0 0 14px rgba(255, 218, 120, .45);
    }

    .count-small {
      font-size: 13px;
      color: #fff6dd;
      font-weight: 700;
    }

    .fruit {
      position: absolute;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      cursor: pointer;
      z-index: 12;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
      animation: fruitPop .35s ease;
    }

    @keyframes fruitPop {
      from { transform: scale(0) rotate(-25deg); }
      to { transform: scale(1) rotate(0); }
    }

    .form-card {
      margin-top: 12px;
      padding: 25px 18px 20px;
      background: linear-gradient(#fffefb, #fff3eb);
      color: #4d3425;
      border: 2px solid #f2cab9;
      border-radius: 30px;
      box-shadow:
        0 16px 42px rgba(0,0,0,.32),
        inset 0 0 0 1px rgba(255,255,255,.8);
    }

    .form-card h2 {
      margin: 0 0 18px;
      font-size: 25px;
      letter-spacing: -1px;
      color: #4e3324;
    }

    .label-row {
      text-align: left;
      font-size: 13px;
      font-weight: 900;
      color: #c35d76;
      margin: 5px 0 7px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #e8bdae;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-family: inherit;
      background: #fffaf6;
      outline: none;
      margin-bottom: 13px;
    }

    textarea {
      min-height: 110px;
      resize: none;
      line-height: 1.5;
    }

    .fruit-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 4px 0 15px;
    }

    .fruit-btn {
      height: 58px;
      border-radius: 16px;
      border: 1px solid #efcaba;
      background: #fff8f1;
      font-size: 27px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,.06);
    }

    .fruit-btn.active {
      border: 2px solid #ff6f93;
      background: #ffe7ee;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(255, 111, 147, .22);
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #ff8fa8, #ff5278);
      box-shadow: 0 10px 22px rgba(255, 82, 120, .36);
      cursor: pointer;
    }

    .footer {
      margin-top: 20px;
      color: #ffe6b2;
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 6px rgba(0,0,0,.55);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      z-index: 99;
      padding: 24px;
      align-items: center;
      justify-content: center;
    }

    .letter {
      width: 100%;
      max-width: 350px;
      background: linear-gradient(#fffaf2, #fff0e5);
      color: #4d3425;
      border: 1px solid #f0c9b8;
      border-radius: 30px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      line-height: 1.75;
    }

    .letter-title {
      color: #c25c70;
      font-weight: 900;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .emoji {
      font-size: 44px;
      margin-bottom: 8px;
    }

    .modal-msg {
      white-space: pre-wrap;
      font-size: 16px;
    }

    .nickname {
      margin-top: 14px;
      color: #d85d75;
      font-weight: 900;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .close, .delete {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 12px;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .close { background: #d9a05b; }
    .delete { background: #777; }

    .admin-hint {
      margin-top: 9px;
      color: #8b7568;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .title { font-size: 40px; }
      .tree { transform: translateX(-50%) scale(.92); }
      .scene { height: 510px; }

      .side-character {
        position: absolute;
        opacity: .36;
        z-index: 1;
        filter: blur(.2px) drop-shadow(0 16px 28px rgba(0,0,0,.55));
      }

      .side-boy {
        left: -92px;
        top: 260px;
        bottom: auto;
        width: 190px;
        height: 190px;
      }

      .side-bear {
        right: -88px;
        top: 272px;
        bottom: auto;
        width: 175px;
        height: 175px;
      }
    }
  </style>
</head>

<body>
  <div class="shooting"></div>
  <div class="shooting two"></div>

  <img class="side-character side-boy" src="boy.png" alt="행도리 캐릭터">
  <img class="side-character side-bear" src="bear.png" alt="곰돌이 캐릭터">

  <main class="wrap">
    <div class="date-badge">✦ 6월 7일 ✦</div>

    <h1 class="title">
      행도리의<br>
      생일나무 <span class="heart">♡</span>
    </h1>

    <div class="ribbon">축하 한마디가 열매가 됩니다.</div>

    <div class="sub">
      여러분의 따뜻한 말 한마디가<br>
      행도리의 생일나무를 반짝이게 해요.
    </div>

    <section class="scene" id="treeArea">
      <div class="moon">🌙</div>

      <div class="tree">
        <div class="crown"></div>
        <div class="branch"></div>
        <div class="branch b2"></div>
        <div class="trunk"></div>
        <div class="lantern l1"></div>
        <div class="lantern l2"></div>
        <div class="lantern l3"></div>
        <div class="lantern l4"></div>
        <div class="lantern l5"></div>
        <div class="lantern l6"></div>
        <div class="lantern l7"></div>
      </div>

      <div class="cake">🎂</div>

      <div class="count-box">
        <div class="count-label">✦ 현재까지 ✦</div>
        <div class="count" id="count">0</div>
        <div class="count-small">개의 축하가 모였어요!</div>
      </div>
    </section>

    <section class="form-card">
      <h2>🌷 축하 한마디 남기기 🌷</h2>

      <div class="label-row">🌸 닉네임</div>
      <input id="nameInput" maxlength="12" placeholder="닉네임을 입력해주세요" />

      <div class="label-row">🌸 축하 멘트</div>
      <textarea id="messageInput" maxlength="120" placeholder="행도리에게 축하 한마디를 남겨주세요!"></textarea>

      <div class="fruit-select">
        <button class="fruit-btn active" data-fruit="🍎">🍎</button>
        <button class="fruit-btn" data-fruit="🍑">🍑</button>
        <button class="fruit-btn" data-fruit="🍉">🍉</button>
        <button class="fruit-btn" data-fruit="🍍">🍍</button>
      </div>

      <button class="submit" id="submitBtn">🍎 열매 달기</button>
    </section>

    <div class="footer">
      ♡ 당신의 따뜻한 말이 행도리의 생일나무를 더 풍성하게 만들어요.
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="letter">
      <div class="letter-title">행도리에게 도착한 축하 편지</div>
      <div class="emoji" id="modalFruit">🍎</div>
      <div class="modal-msg" id="modalMessage"></div>
      <div class="nickname" id="modalName"></div>

      <div class="modal-actions">
        <button class="close" onclick="closeModal()">닫기</button>
        <button class="delete" id="deleteBtn">관리자 삭제</button>
      </div>

      <div class="admin-hint">관리자만 삭제할 수 있어요.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Wca2IDavR1TLIpWYMz8TIUzttm9vzfXE",
      authDomain: "hangdori-ab07d.firebaseapp.com",
      projectId: "hangdori-ab07d",
      storageBucket: "hangdori-ab07d.firebasestorage.app",
      messagingSenderId: "797694080049",
      appId: "1:797694080049:web:6fdf62f9cb4ac9d8255110"
    };

    const ADMIN_PASSWORD = "hangdori0607";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const treeArea = document.getElementById("treeArea");
    const countEl = document.getElementById("count");
    const nameInput = document.getElementById("nameInput");
    const messageInput = document.getElementById("messageInput");
    const submitBtn = document.getElementById("submitBtn");
    const modal = document.getElementById("modal");
    const modalFruit = document.getElementById("modalFruit");
    const modalMessage = document.getElementById("modalMessage");
    const modalName = document.getElementById("modalName");
    const deleteBtn = document.getElementById("deleteBtn");

    let selectedFruit = "🍎";
    let selectedDocId = null;

    const positions = [
      [165, 132], [110, 165], [220, 166], [78, 215],
      [250, 220], [145, 230], [190, 265], [105, 285],
      [235, 295], [160, 85], [212, 104], [100, 112],
      [265, 135], [65, 150], [285, 180], [188, 204],
      [130, 250], [230, 250], [155, 310], [255, 330]
    ];

    document.querySelectorAll(".fruit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fruit-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFruit = btn.dataset.fruit;
      });
    });

    submitBtn.addEventListener("click", async () => {
      const nickname = nameInput.value.trim() || "익명의 친구";
      const message = messageInput.value.trim();

      if (!message) {
        alert("축하 멘트를 적어주세요!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "열매 다는 중...";

      try {
        await addDoc(collection(db, "birthdayMessages"), {
          nickname,
          message,
          fruit: selectedFruit,
          createdAt: serverTimestamp()
        });

        nameInput.value = "";
        messageInput.value = "";
        alert("행도리의 생일나무에 열매가 열렸어요!");
      } catch (error) {
        alert("저장 중 문제가 생겼어요.");
        console.error(error);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "🍎 열매 달기";
    });

    const q = query(collection(db, "birthdayMessages"), orderBy("createdAt", "asc"));

    onSnapshot(q, (snapshot) => {
      document.querySelectorAll(".fruit").forEach(el => el.remove());
      countEl.innerText = snapshot.size;

      snapshot.docs.forEach((docSnap, index) => {
        const data = docSnap.data();
        const fruit = document.createElement("div");
        fruit.className = "fruit";
        fruit.innerText = data.fruit || "🍎";

        const pos = positions[index % positions.length];
        fruit.style.left = pos[0] + "px";
        fruit.style.top = pos[1] + "px";

        fruit.addEventListener("click", () => {
          selectedDocId = docSnap.id;
          modalFruit.innerText = data.fruit || "🍎";
          modalMessage.innerText = data.message || "";
          modalName.innerText = "- " + (data.nickname || "익명의 친구") + " -";
          modal.style.display = "flex";
        });

        treeArea.appendChild(fruit);
      });
    });

    deleteBtn.addEventListener("click", async () => {
      if (!selectedDocId) return;

      const password = prompt("관리자 비밀번호를 입력해주세요.");

      if (password !== ADMIN_PASSWORD) {
        alert("비밀번호가 맞지 않아요.");
        return;
      }

      const ok = confirm("이 축하글을 삭제할까요?");
      if (!ok) return;

      try {
        await deleteDoc(doc(db, "birthdayMessages", selectedDocId));
        alert("삭제됐어요.");
        closeModal();
      } catch (error) {
        alert("삭제 중 문제가 생겼어요.");
        console.error(error);
      }
    });

    window.closeModal = function () {
      modal.style.display = "none";
      selectedDocId = null;
    };

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
